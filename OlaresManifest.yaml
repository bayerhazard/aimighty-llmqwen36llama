olaresManifest.version: '0.12.0'
olaresManifest.type: app
apiVersion: 'v3'

workloadReplicas:
  aimqwen36llama: 1

metadata:
  name: aimqwen36llama
  icon: https://raw.githubusercontent.com/bayerhazard/aimighty-llmqwen36llama/main/icon.png
  description: Qwen3.6-27B chat via beellama (llama.cpp) — 200K context, vision, DFlash, turbo4 KV
  appid: aimqwen36llama
  title: AIM Qwen3.6 27B
  version: '26.08.1'
  categories:
    - AI
    - Vision

entrances:
  - name: aimqwen36llama
    port: 8000
    host: aimqwen36llama
    title: AIM Qwen3.6 27B
    icon: https://raw.githubusercontent.com/bayerhazard/aimighty-llmqwen36llama/main/icon.png
    openMethod: window
    authLevel: internal

spec:
  versionName: '26.08.1'
  fullDescription: |
    AImighty HQ stack for Qwen3.6-27B optimized for coding and agentic workflows on Olares One.

    **Model:** unsloth/Qwen3.6-27B-UD-Q4_K_XL
    **Draft:** Ardenzard/Qwen3.6-27B-DFlash-GGUF IQ4_XS
    **Engine:** ghcr.io/anbeeld/beellama.cpp:server-cuda13-v0.3.1 (official build, native sm_120)
    **KV Cache:** turbo4 (4-bit Walsh-Hadamard rotated)
    **Vision:** mmproj-F16-27B.gguf on GPU
    **Speculation:** DFlash with --spec-dflash-cross-ctx 1024
    **Context:** 200K tokens with prompt cache (--cache-ram -1)
    **Batch:** 2048 / 512 (processing-optimized)
    **Chat Template:** Custom agentic Jinja2 template (multi-turn tool-call fix,
      developer role support, robust reasoning handling, think-disabled)

    **Performance (RTX 5090 Blackwell, 24 GiB, 200k ctx, turbo4, live measured):**
    - Performance Coding: 120 t/s
    - Performance Poetry: 40 t/s
    - Vision encoder on GPU
  upgradeDescription: |
    v3.3.1: Stability fix for HAMi GPU OOM restarts. The adaptive draft-depth
    controller (adaptive dm profit) dynamically reallocates GPU memory at
    94% VRAM and overflowed HAMi's allocator (UINT64_MAX OOM) after ~1h runtime.
    Fix: --no-spec-dm-adaptive --spec-draft-n-max 8 (fixed draft depth, no dynamic
    reallocations). Acceptance tradeoff negligible (first 8 draft tokens carry
    ~80% of acceptance). Decode/VRAM unchanged.
    v3.3.0: Engine upgrade aamsellem 0.1.3-rc1 -> official beellama v0.3.1
    (server-cuda13, native Blackwell sm_120). Fixes task-switch instability:
    DFlash multi-slot crash fix (issue #24), adaptive draft-depth controller
    now resets per-request state, stale drafter KV cleared before tool-call
    continuations, fused TurboQuant FlashAttention repaired for turbo4.
    --parallel 2 (unified KV) for task isolation: pausing task A and starting
    task B no longer carries state between tasks. Rollback: reinstall 3.2.5.
    Pairs with the LiteLLM expert (thinking off) / expert-thinking (thinking on)
    endpoint split for agentic workflows.
  developer: Aimighty
  website: https://github.com/bayerhazard/aimighty-llmqwen36llama
  sourceCode: https://github.com/bayerhazard/aimighty-llmqwen36llama
  requiredCpu: "4"
  limitedCpu: "16"
  requiredMemory: 24Gi
  limitedMemory: 40Gi
  requiredDisk: 25Gi
  limitedDisk: 50Gi
  requiredGpu: 1
  supportArch:
    - amd64

permission:
  appData: true

envs:
  - envName: HF_TOKEN
    required: false
    applyOnChange: true
    valueFrom:
      envName: OLARES_USER_HUGGINGFACE_TOKEN

options:
  apiTimeout: 3600
  allowMultipleInstall: false
  dependencies:
    - name: olares
      version: '>=1.12.6-0'
      type: system
