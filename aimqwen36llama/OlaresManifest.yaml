olaresManifest.version: '0.12.0'
olaresManifest.type: app
apiVersion: 'v3'

workloadReplicas:
  aimqwen36llama: 1

metadata:
  name: aimqwen36llama
  icon: https://raw.githubusercontent.com/bayerhazard/aimighty-llmqwen36llama/main/icon.png
  description: Qwen3.6-27B chat via beellama (llama.cpp) — 200K context, vision, DFlash, turbo4 KV
  appid: aimqwen36llama
  title: AIM Qwen3.6 27B
  version: '26.08.1'
  categories:
    - AI
    - Vision

entrances:
  - name: aimqwen36llama
    port: 8000
    host: aimqwen36llama
    title: AIM Qwen3.6 27B
    icon: https://raw.githubusercontent.com/bayerhazard/aimighty-llmqwen36llama/main/icon.png
    openMethod: window
    authLevel: internal

spec:
  versionName: '26.08.1'
  fullDescription: |
    AImighty flagship stack for Qwen3.6-27B, optimized for coding and agentic workflows on Olares One.

    **Model**
    unsloth/Qwen3.6-27B-UD-Q4_K_XL (UD-Q4_K_XL, ~17.6 GB).
    Draft: Ardenzard/Qwen3.6-27B-DFlash-GGUF IQ4_XS.
    Vision: mmproj-F16-27B.gguf on GPU.
    200K token context.

    **Inference Engine**
    aamsellem/beellama-cpp:0.1.3-rc1 (custom Blackwell sm_120 build).
    KV Cache: turbo4 (4-bit Walsh-Hadamard rotated).
    Speculation: DFlash with --spec-dflash-cross-ctx 1024.
    Parallel slots: 1 (single-slot).
    Batch: 2048/512 (processing-optimized).
    Custom agentic Jinja2 chat template (multi-turn tool-call fix, developer role support, robust reasoning handling, think-disabled).

    **Performance (RTX 5090 Blackwell, 24 GiB, 200k ctx, turbo4, live measured)**
    - Decode: 81-106 t/s warm (single-slot load)
    - Boot to listening: ~6s (models on disk)
    - Vision encoder on GPU

    **API**
    OpenAI-compatible: /v1/chat/completions, /v1/models, /health.

    **Resource Usage**
    GPU: ~23 GB VRAM (RTX 5090, 24 GB)
    RAM: 24-40 GB
    Disk: 25 GB (model cache)
    CPU: 4-16 cores
  upgradeDescription: |
    v26.08.1: Unified naming — title "AIM Qwen3.6 27B" (engine suffix removed),
    categories AI + Vision, English descriptions. Built for Olares 1.12.6.
    v3.3.3: Rollback to aamsellem/beellama-cpp:0.1.3-rc1 (custom Blackwell sm_120
    build) + --parallel 1. Reverts the v0.3.1 upgrade and HAMi OOM fix from 3.3.x.
    The v0.3.1 engine introduced HAMi GPU OOM crashes at high VRAM load despite
    the --no-spec-dm-adaptive workaround; this version returns to the proven
    0.1.3-rc1 engine with stable DFlash speculation, task isolation, and no
    adaptive dm reallocations. Reasoning budget unchanged at 2048.
  developer: Aimighty
  website: https://github.com/bayerhazard/aimighty-llmqwen36llama
  sourceCode: https://github.com/bayerhazard/aimighty-llmqwen36llama
  requiredCpu: "4"
  limitedCpu: "16"
  requiredMemory: 24Gi
  limitedMemory: 40Gi
  requiredDisk: 25Gi
  limitedDisk: 50Gi
  requiredGpu: 1
  supportArch:
    - amd64

permission:
  appData: true

envs:
  - envName: HF_TOKEN
    required: false
    applyOnChange: true
    valueFrom:
      envName: OLARES_USER_HUGGINGFACE_TOKEN

options:
  apiTimeout: 3600
  allowMultipleInstall: false
  dependencies:
    - name: olares
      version: '>=1.12.6-0'
      type: system
