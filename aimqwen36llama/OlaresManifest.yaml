spec:
  versionName: '2.5.0'
  fullDescription: |
    Qwen3.6-27B beellama - UD-Q4_K_XL - DFlash Q4_K_M - kvarn4 KV

    Optimized for coding and agentic workflows on Olares One.

    Features:
    - beellama.cpp server-cuda-preview-v0.4.1 (upstream draft-dflash)
    - Unsloth Qwen3.6-27B UD-Q4_K_XL (17.6 GB)
    - DFlash speculative decoding with Q4_K_M drafter (1 GB)
    - kvarn4 KV cache (4-bit, ~17 KB/token)
    - 200K token context with prompt cache
    - parallel 2 (2x throughput)
    - OpenAI-compatible API at port 8000
  upgradeDescription: |
    v2.5.0: Fix beellama v0.4.x compat — --spec-type draft-dflash, fork-private --spec-dflash-cross-ctx entfernt (in v0.4.0 abgeschafft, verursachte CrashLoop). Fix OlaresManifest v3 Struktur — fullDescription/versionName/developer unter spec: (waren versehentlich Teil des upgradeDescription-Blockskalars). Fix values.yaml olaresEnv Default (helm nil pointer). DFlash-Drafter IQ4_XS → Q4_K_M. apiTimeout 3600. v2.4.0: beellama.cpp v0.3.2 → v0.4.1 (native KVarN + DFlash CUDA kernels). HAMi GPU fix — runtimeClassName: nvidia entfernt. Threads 16, cache-ram -1 (Prompt-Cache an), parallel 1→2 (2x Throughput). v2.3.3: Revert parallel 2→1, cache-ram 2048→0 (OOM-Risiko). v2.3.0: check-auth command:["true"] (Webhook compat). v1.7.x: Reasoning-Parameter-Serie. v1.7.0: Prompt-Cache reaktiviert, temp 0.6, threads 16. v1.6.x: chartrepo compat (inline base64 chat template). v1.3.x: kvarn4 KV, OOM-Fixes, self-contained chart. v1.2.x: Sidecar im Chart, GPU validation fix.
  developer: Aimighty
  website: https://github.com/bayerhazard/aimighty-llmqwen36llama
  sourceCode: https://github.com/bayerhazard/aimighty-llmqwen36llama
  requiredCpu: "4"
  limitedCpu: "16"
  requiredMemory: 24Gi
  limitedMemory: 40Gi
  requiredDisk: 25Gi
  limitedDisk: 50Gi
  requiredGpu: 1
  supportArch:
    - amd64

permission:
