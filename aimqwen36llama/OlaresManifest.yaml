spec:
  versionName: '2.6.0'
  fullDescription: |
    Qwen3.6-27B beellama - UD-Q3_K_XL - Spiritbuun DFlash - turbo3 KV

    Optimized for coding and agentic workflows on Olares One.

    Features:
    - aamsellem/beellama-cpp:0.1.3-rc1 (custom sm_120 build for RTX 5090)
    - Unsloth Qwen3.6-27B UD-Q3_K_XL (14.5 GB, non-MTP)
    - Spiritbuun DFlash Q4_K_M drafter (1 GB)
    - turbo3 KV cache (3-bit Walsh-Hadamard, scales linearly with context)
    - Vision encoder (mmproj-F16, CPU offload)
    - DFlash with --spec-dflash-cross-ctx 1024
    - 200K token context with prompt cache
    - batch 2048, ubatch 2048
    - OpenAI-compatible API at port 8000
  upgradeDescription: |
    v2.6.0: Foundation-Update — Image auf aamsellem/beellama-cpp:0.1.3-rc1 (custom Blackwell sm_120 Build mit TurboQuant FA-Kompilation). Target auf unsloth Q3_K_XL (14.5 GB, non-MTP, ~3 GB weniger VRAM als Q4_K_XL). Draft auf spiritbuun dflash-draft-3.6-q4_k_m (altes Format, kompatibel mit alten dflash Spec-Type). KV von q4_0 auf turbo3 (Walsh-Hadamard 3-bit, ~30% weniger VRAM). Spec-Type von draft-dflash auf dflash --spec-dflash-cross-ctx 1024 (ursprüngliche fork-eigene DFlash-API). Vision mmproj mit CPU-Offload hinzugefügt. Reasoning-Komplexität reduziert (reasoning off statt reasoning-loop-guard). Veraltete v0.4.x-Workarounds entfernt (--fit off bleibt für n_gpu_layers-Abort-Schutz).
  developer: Aimighty
  website: https://github.com/bayerhazard/aimighty-llmqwen36llama
  sourceCode: https://github.com/bayerhazard/aimighty-llmqwen36llama
  requiredCpu: "4"
  limitedCpu: "16"
  requiredMemory: 24Gi
  limitedMemory: 40Gi
  requiredDisk: 25Gi
  limitedDisk: 50Gi
  requiredGpu: 1
  supportArch:
    - amd64

permission:
  appData: true

envs:
  - envName: HF_TOKEN
    required: false
    applyOnChange: true
    valueFrom:
      envName: OLARES_USER_HUGGINGFACE_TOKEN

options:
  apiTimeout: 3600
  allowMultipleInstall: false
  dependencies:
    - name: olares
      version: '>=1.12.6-0'
      type: system
