olaresManifest.version: '0.12.0'
olaresManifest.type: app
apiVersion: 'v3'

workloadReplicas:
  aimqwen36llama: 1

metadata:
  name: aimqwen36llama
  icon: https://raw.githubusercontent.com/bayerhazard/aimighty-llmqwen36llama/main/icon.png
  description: Qwen3.6-27B beellama - UD-Q3_K_XL - Spiritbuun DFlash - turbo3 KV
  appid: aimqwen36llama
  title: AIM Qwen3.6 27B Beellama
  version: '2.6.0'
  categories:
    - AI
    - Developer Tools

entrances:
  - name: aimqwen36llama
    port: 8000
    host: aimqwen36llama
    title: AIM Qwen3.6 27B Beellama
    icon: https://raw.githubusercontent.com/bayerhazard/aimighty-llmqwen36llama/main/icon.png
    openMethod: window
