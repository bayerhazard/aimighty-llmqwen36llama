spec:
  versionName: '1.4.0'
  fullDescription: |
    Qwen3.6-27B beellama (Aimighty) — UD-Q3_K_XL + Spiritbuun DFlash + turbo3 KV + Vision

    Optimized for coding and agentic workflows on Olares One. Based on the proven
    aamsellem/beellama-cpp:0.1.3-rc1 image (custom sm_120 Blackwell build).

    **Model:** unsloth/Qwen3.6-27B-UD-Q3_K_XL (14.5 GB, non-MTP variant)
    **Draft:** spiritbuun/Qwen3.6-27B-DFlash-GGUF dflash-draft-3.6-q4_k_m (1 GB)
    **Engine:** aamsellem/beellama-cpp:0.1.3-rc1 — custom Blackwell sm_120 build
    **KV Cache:** turbo3 (3-bit Walsh-Hadamard rotated, scales linearly with context)
    **Vision:** mmproj-F16-27B.gguf with CPU offload (--no-mmproj-offload)
    **Speculation:** DFlash with --spec-dflash-cross-ctx 1024
    **Context:** 200K tokens with prompt cache (--cache-ram -1)
    **Batch:** 2048 / 2048 (equal)
    **Chat Template:** Custom agentic Jinja2 template (multi-turn tool-call fix,
      developer role support, robust reasoning handling)
    **API:** OpenAI-compatible at port 8000 (/v1/chat/completions, /health)

    **Performance (RTX 5090 Blackwell, 24 GiB, 200k ctx):**
    - Warm prompt: ~125 t/s
    - Text generation: ~44-61 t/s
    - VRAM: ~21 GB (86%) — stable with headroom for long generations
    - Vision encoder active (clip, CPU offload)
  upgradeDescription: |
    v1.4.0: Foundation-Release — Neuaufbau des Stacks auf Basis des bewährten
    aamsellem/beellama-cpp:0.1.3-rc1 Image (custom sm_120 Blackwell-Build).
    OlaresManifest auf API-Version v3 migriert.

    **Änderungen gegenüber v2.x:**
    - Image: aamsellem/beellama-cpp:0.1.3-rc1 (custom Blackwell sm_120 + CUDA 13)
    - Target: unsloth Q3_K_XL (14.5 GB, non-MTP, ~3 GB weniger VRAM als Q4_K_XL)
    - Draft: spiritbuun dflash-draft-3.6-q4_k_m (kompatibel mit legacy dflash)
    - KV Cache: turbo3 (3-bit Walsh-Hadamard, ~30% weniger VRAM als q4_0)
    - Spec-Type: dflash + --spec-dflash-cross-ctx 1024 (legacy DFlash-API, stabil)
    - Vision: mmproj-F16 mit CPU-Offload (--no-mmproj-offload)
    - Reasoning: off (agent-optimized)
    - Keine v0.4.x-Workarounds mehr nötig (KVarN-Rollback-Bug vermieden)
    - ~21 GB VRAM (86%) — stabil mit Headroom für lange Generationen
  developer: Aimighty
  website: https://github.com/bayerhazard/aimighty-llmqwen36llama
  sourceCode: https://github.com/bayerhazard/aimighty-llmqwen36llama
  requiredCpu: "4"
  limitedCpu: "16"
  requiredMemory: 24Gi
  limitedMemory: 40Gi
  requiredDisk: 25Gi
  limitedDisk: 50Gi
  requiredGpu: 1
  supportArch:
    - amd64

permission:
  appData: true

envs:
  - envName: HF_TOKEN
    required: false
    applyOnChange: true
    valueFrom:
      envName: OLARES_USER_HUGGINGFACE_TOKEN

options:
  apiTimeout: 3600
  allowMultipleInstall: false
  dependencies:
    - name: olares
      version: '>=1.12.6-0'
      type: system
