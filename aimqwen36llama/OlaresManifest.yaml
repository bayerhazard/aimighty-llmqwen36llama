spec:
  versionName: '2.5.1'
  fullDescription: |
    Qwen3.6-27B beellama - UD-Q4_K_XL - DFlash Q4_K_M - q4_0 KV

    Optimized for coding and agentic workflows on Olares One.

    Features:
    - beellama.cpp server-cuda-preview-v0.4.1 (upstream draft-dflash)
    - Unsloth Qwen3.6-27B UD-Q4_K_XL (17.6 GB)
    - DFlash speculative decoding with Q4_K_M drafter (1 GB)
    - q4_0 KV cache (kvarn4 currently incompatible with draft-dflash)
    - 200K token context with prompt cache
    - parallel 1 (draft-dflash multi-slot workaround)
    - OpenAI-compatible API at port 8000
  upgradeDescription: |
    v2.5.1: Runtime-Fixes nach Live-Debugging — CUDA_DEVICE_MEMORY_LIMIT_0=30000m (HAMi capped cudaMalloc sonst → OOM), parallel 2→1 (v0.4.1 draft-dflash multi-slot Bug: vector::_M_range_check bei slot[1]), KV kvarn4→q4_0 (kvarn+dflash = "internal prompt-cache rollback failure" bei jedem Request, beellama issue #93), --fit off (Fitter-Abort bei gepinntem -ngl). DFlash Acceptance 100% (26/26), q4_0 Boot 22s. v2.5.0: Fix beellama v0.4.x compat — --spec-type draft-dflash, fork-private --spec-dflash-cross-ctx entfernt. Fix OlaresManifest v3 Struktur (fullDescription/versionName unter spec:). Fix values.yaml olaresEnv Default (helm nil pointer). DFlash-Drafter IQ4_XS → Q4_K_M. apiTimeout 3600. v2.4.0: beellama.cpp v0.3.2 → v0.4.1. HAMi GPU fix — runtimeClassName: nvidia entfernt. v2.3.3: parallel 2→1, cache-ram→0 (OOM). v2.3.0: check-auth command:["true"] (Webhook compat). v1.7.x: Reasoning-Parameter-Serie. v1.6.x: chartrepo compat (inline base64 chat template). v1.3.x: kvarn4 KV, OOM-Fixes, self-contained chart.
  developer: Aimighty
  website: https://github.com/bayerhazard/aimighty-llmqwen36llama
  sourceCode: https://github.com/bayerhazard/aimighty-llmqwen36llama
  requiredCpu: "4"
  limitedCpu: "16"
  requiredMemory: 24Gi
  limitedMemory: 40Gi
  requiredDisk: 25Gi
  limitedDisk: 50Gi
  requiredGpu: 1
  supportArch:
    - amd64

permission:
  appData: true

envs:
  - envName: HF_TOKEN
    required: false
    applyOnChange: true
    valueFrom:
      envName: OLARES_USER_HUGGINGFACE_TOKEN

options:
  apiTimeout: 3600
  allowMultipleInstall: false
  dependencies:
    - name: olares
      version: '>=1.12.6-0'
      type: system
